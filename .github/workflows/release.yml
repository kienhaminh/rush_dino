name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: rushdino-linux-x86_64
    steps:
      - name: Install base tools
        run: apt-get update && apt-get install -y git curl build-essential pkg-config libssl-dev xz-utils
      - uses: actions/checkout@v5
      - name: Install Node.js 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          "$HOME/.cargo/bin/rustup" target add ${{ matrix.target }}
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
      - name: Build backend
        env:
          CC_x86_64_unknown_linux_gnu: gcc
        run: cargo build --release --target ${{ matrix.target }} -p rushdino-cli
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/rushdino"
          cp "$BIN" "dist/${{ matrix.artifact }}"
          cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-dist
          merge-multiple: true
      - name: Publish beta release assets
        if: contains(github.ref_name, '-beta.')
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**
          prerelease: true
          make_latest: false
      - name: Publish stable release assets
        if: ${{ !contains(github.ref_name, '-beta.') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**
          make_latest: true
