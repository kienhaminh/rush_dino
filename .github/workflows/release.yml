name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: rushdino-linux-x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        run: pip3 install ziglang && cargo install cargo-zigbuild
      - name: Build backend
        run: cargo zigbuild --release --target ${{ matrix.target }}.2.35 -p rushdino-cli
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/rushdino"
          cp "$BIN" "dist/${{ matrix.artifact }}"
          cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-dist
          merge-multiple: true
      - name: Publish beta release assets
        if: contains(github.ref_name, '-beta.')
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**
          prerelease: true
          make_latest: false
      - name: Publish stable release assets
        if: ${{ !contains(github.ref_name, '-beta.') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**
          make_latest: true
