name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: rushdino-linux-x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build frontend
        run: cd frontend && npm install && npm run build
      - name: Build backend
        run: cargo build --release --target ${{ matrix.target }} -p rushdino-cli
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rushdino dist/${{ matrix.artifact }}
          cd dist && sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-dist
          merge-multiple: true
      - name: Publish beta release
        if: contains(github.ref_name, '-beta.')
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**
          prerelease: true
          make_latest: false
      - name: Publish stable release
        if: ${{ !contains(github.ref_name, '-beta.') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**
          make_latest: true
