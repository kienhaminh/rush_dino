[workspace]
members = [
  "crates/common",
  "crates/providers",
  "crates/agent",
  "crates/acp",
  "crates/gateway",
  "crates/security",
  "crates/server",
  "crates/extensions/telegram",
  "crates/extensions/discord",
  "crates/extensions/slack",
  "crates/cli",
  "crates/auth",
  "crates/knowledge-graph",
  "crates/skill-graph",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RushDino Contributors"]

[workspace.dependencies]
anyhow = "1"
arc-swap = "1.7"
base64 = "0.22"
async-openai = "0.24"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
dirs = "5"
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
hex = "0.4"
ipnet = "2"
open = "5"
pulldown-cmark = "0.13.0"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
self_update = { version = "0.41", default-features = false, features = ["archive-zip", "compression-zip-deflate", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
teloxide = { version = "0.13", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
neo4rs = "0.9.0-rc.9"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[workspace.lints.clippy]
pedantic = "warn"

[profile.dev.package."*"]
# Compile all external crates (crates.io deps) without debug info.
# Cuts deps/ directory size by ~60-70% (e.g. serenity drops from 74 MB to ~15 MB).
# Workspace crates still get full debug info from [profile.dev].
debug = false
opt-level = 1

[profile.release]
opt-level = 3         # Optimize for speed
lto = true            # Enable Link Time Optimization
codegen-units = 1     # Maximize LTO impact
panic = "abort"       # Remove unwinding infrastructure
strip = true          # Remove symbols from final binary
debug = false         # Skip generating debug info — strip = true would discard it anyway
