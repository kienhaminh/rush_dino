[workspace]
members = [
  "crates/common",
  "crates/providers",
  "crates/agent",
  "crates/gateway",
  "crates/server",
  "crates/extensions/telegram",
  "crates/extensions/discord",
  "crates/extensions/slack",
  "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RushDino Contributors"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
async-openai = "0.24"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
dirs = "5"
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
hex = "0.4"
open = "5"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
rust-embed = "8"
self_update = { version = "0.41", default-features = false, features = ["archive-zip", "compression-zip-deflate", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[workspace.lints.clippy]
pedantic = "warn"
