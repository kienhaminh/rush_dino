<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RushDino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Host+Grotesk:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap"
    />
  </head>
  <body>
    <script>
      // FOUC guard: apply the persisted theme override before CSS loads,
      // so light-mode users don't flash dark on cold start.
      (function () {
        try {
          var t = localStorage.getItem('rd:theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
          var a = localStorage.getItem('rd:accent');
          if (a === 'teal' || a === 'violet' || a === 'amber' || a === 'mint') {
            document.documentElement.setAttribute('data-accent', a);
          }
        } catch (e) {
          /* localStorage unavailable — skip */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
