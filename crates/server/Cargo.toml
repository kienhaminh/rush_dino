[package]
name = "rushdino-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rushdino_server"
path = "src/lib.rs"

[[bin]]
name = "rushdino-server"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
arc-swap.workspace = true
hex.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
toml.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed.workspace = true
uuid.workspace = true
walkdir.workspace = true
reqwest.workspace = true
anyhow.workspace = true
url.workspace = true
bytes = "1"
rushdino-common = { path = "../common" }
rushdino-auth = { path = "../auth" }
rushdino-providers = { path = "../providers" }
rushdino-agent = { path = "../agent" }
rushdino-gateway = { path = "../gateway" }
rushdino-knowledge-graph = { path = "../knowledge-graph" }
rushdino-skill-graph = { path = "../skill-graph" }
rushdino-security = { path = "../security", features = ["audit-log"] }
serde_yaml = "0.9"
rushdino-telegram = { path = "../extensions/telegram" }
rushdino-discord = { path = "../extensions/discord" }
rushdino-slack = { path = "../extensions/slack" }
self_update = { workspace = true }
semver.workspace = true

[dev-dependencies]
tempfile = "3"
tower.workspace = true
uuid.workspace = true
sqlx.workspace = true
